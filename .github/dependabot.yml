# Dependabot configuration — enables automated dependency & GitHub Actions update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Maven dependencies across the multi-module reactor
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      flink:
        patterns:
          - "org.apache.flink:*"
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.mockito:*"
          - "org.testcontainers:*"
          - "org.testng:*"

  # Keep GitHub Actions pinned versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
